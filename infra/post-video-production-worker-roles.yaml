AWSTemplateFormatVersion: '2010-09-09'
Description: Separate production task identities for the dedicated post-video worker. Review as a change set before activation.
Parameters:
  MediaBucketArn:
    Type: String
    AllowedPattern: '^arn:aws:s3:::[a-z0-9.-]+$'
  BackendSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:arc/prod/backend-[A-Za-z0-9]+$'
Resources:
  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: ProductionVideoWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The existing legacy Clip worker reads the original Post media
              # key. Keep that historical read path when moving its queue.
              - Sid: ReadLegacyAndNewInputs
                Effect: Allow
                Action: 's3:GetObject'
                Resource: !Sub '${MediaBucketArn}/*'
              - Sid: WriteVersionedOutputs
                Effect: Allow
                Action: ['s3:PutObject', 's3:DeleteObject']
                Resource:
                  - !Sub '${MediaBucketArn}/gaming-social/clips/*'
                  - !Sub '${MediaBucketArn}/post-video-playback/*'
              - Sid: ListOutputPrefixesForCleanup
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !Ref MediaBucketArn
                Condition:
                  StringLike:
                    s3:prefix: ['gaming-social/clips/*', 'post-video-playback/*']
              - Sid: ReadRuntimeConfiguration
                Effect: Allow
                Action: ['secretsmanager:GetSecretValue', 'secretsmanager:DescribeSecret']
                Resource: !Ref BackendSecretArn
              - Sid: ProtectDedicatedWorkerTasksInArcCluster
                Effect: Allow
                Action: ['ecs:GetTaskProtection', 'ecs:UpdateTaskProtection']
                Resource: arn:aws:ecs:us-east-1:906446637180:task/arc-cluster/*
                Condition:
                  ArnEquals:
                    ecs:cluster: arn:aws:ecs:us-east-1:906446637180:cluster/arc-cluster
Outputs:
  ExecutionRoleArn:
    Value: !GetAtt WorkerExecutionRole.Arn
  TaskRoleArn:
    Value: !GetAtt WorkerTaskRole.Arn
