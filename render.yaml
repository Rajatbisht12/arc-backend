services:
  - type: web
    name: arc-modular-backend
    runtime: node
    rootDir: arc_-main/modular-backend
    buildCommand: npm install && npm run build
    preDeployCommand: npm run preflight:push-release
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PUSH_NOTIFICATION_PROVIDER
        value: expo
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: EXPO_PUSH_SECURITY_MODE
        value: enabled
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY_BASE64
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.arcSquadHunt
      - key: APNS_VOIP_TOPIC
        value: com.arcSquadHunt.voip
      - key: APNS_ENVIRONMENT
        value: production
      - key: MAX_CALL_DURATION_SECONDS
        value: 14400
      - key: CORS_ORIGIN
        value: https://arc.squadhunt.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://arc-backend-1.onrender.com/api/auth/google/callback
      - key: CLIENT_URL
        value: https://arc.squadhunt.com
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "ARC <noreply@squadhunt.com>"
      - key: ZEGOCLOUD_APP_ID
        sync: false
      - key: ZEGOCLOUD_SERVER_SECRET
        sync: false
      # HTTP nodes enqueue work and run the recovery scan; CPU-heavy FFmpeg
      # runs only in the isolated Docker worker below.
      - key: CLIP_HLS_ENABLED
        value: true
      - key: CLIP_HLS_WORKER_ENABLED
        value: false

  - type: worker
    name: arc-clip-hls-worker
    runtime: docker
    rootDir: arc_-main/modular-backend
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:clip-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIP_HLS_ENABLED
        value: true
      - key: CLIP_HLS_WORKER_ENABLED
        value: true
      - key: CLIP_HLS_WORKER_CONCURRENCY
        value: 1
      - key: CLIP_HLS_JOB_ATTEMPTS
        value: 3
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_TLS
        sync: false
      - key: MONGODB_TLS_CA_FILE
        value: /app/rds-ca-bundle.pem
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        sync: false
      # The shared environment schema validates these production secrets even
      # though the worker never reads authentication or payout data itself.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: BANK_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_CDN_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
